<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album sistemas distribuidos Lina</title>

<!--Bootstrap CSS para que se vea lindo :3-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!--Enlazando con estitlos--> 
    <link rel="stylesheet" href="https://raw.githubusercontent.com/Umblina/AlbumRazasPerritos/refs/heads/main/css/styles.css" >

    <!--Para que se mantengan las tarjetas organizadas y se vean visualmente estetico--> 
    <style>
        .card {
            height: 100%; /* Asegura que todas las tarjetas tengan la misma altura */
        }
        .card-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Asegura que el contenido se distribuya uniformemente */
        }
        .card-img-top {
            height: 100%; /* Asegura que la imagen ocupe toda la altura del contenedor */
            width: 100%; /* Asegura que la imagen ocupe todo el ancho del contenedor */
            object-fit: cover; /* Asegura que la imagen cubra el contenedor sin distorsionarse */
            object-position: center; /* Centra la imagen dentro del contenedor */
        }
    
        /* Media Queries para ajustar la altura de la imagen en pantallas más pequeñas */
        @media (max-width: 768px) {
            .card-img-top {
                height: 200px; /* Ajusta la altura de la imagen en pantallas pequeñas */
            }
        }
    
        @media (max-width: 576px) {
            .card-img-top {
                height: 150px; /* Ajusta la altura de la imagen en pantallas muy pequeñas */
            }
        }
    </style>

</head>
<body class="FONDO">

     <!--clase de bootstrap--> 
 <div class="container mt-4"> 
                                         <!--Título--> 
    <h1 class="ALBUM text-center mb-4"> Album Wedding ▼⁠・⁠ᴥ⁠・⁠▼</h1>
    <div class="row">

   <!--Tarjeta 1 HUSKY CAFE--> 
    <div class="col-12 col-md-4 mb-4">
       <div class="card">
        <img src="https://raw.githubusercontent.com/Umblina/AlbumRazasPerritos/refs/heads/main/Fotos/husky_color_cafe.jpg" class="card-img-top"alt="imagen1">
        <div class="card-body">
            <h2 class="TITULO_TARJETA text-center">Ring </h2>
            
            <button class="BOTON_1">Mirar</button>
           
        </div>
        </div>
    </div>

<!--Tarjeta 2 Bulldog Inglés--> 
<div class="col-12 col-md-4 mb-4">
       <div class="card">
        <img src="https://raw.githubusercontent.com/Umblina/AlbumRazasPerritos/refs/heads/main/Fotos/bulldog%20ingles.jpg" class="card-img-top"alt="imagen1">
        <div class="card-body">
            <h2 class="TITULO_TARJETA text-center">Ring 2</h2>
           
            <button class="BOTON_1">Mirar</button>
            <button class="BOTON_2">Editar</button>
        </div>
        </div>
    </div>

<!--Tarjeta 3 Pastor Alemán --> 
    <div class="col-12 col-md-4 mb-4">
        <div class="card">
         <img src="Fotos/pastor aleman.jpg" class="card-img-top"alt="imagen1">
         <div class="card-body">
             <h2 class="TITULO_TARJETA text-center">Ring 3</h2>
             
             <button class="BOTON_1">Mirar</button>
             <button class="BOTON_2">Editar</button>
         </div>
         </div>
     </div>

    </div>
    
   
 <!--Bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
